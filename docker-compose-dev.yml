services:
  aowow:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: aowow
    hostname: aowow
    restart: unless-stopped
    ports:
      - "${AOWOW_PORT:-81}:80"
    environment:
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ./aowow-src:/var/www/html
    networks:
      - wow_backend_net

  mpq-extractor:
    build:
      context: .
      dockerfile: Dockerfile.mpq
    profiles: ["tools"]
    volumes:
      - ${WOW_DATA_DIR:?Please set WOW_DATA_DIR in .env}:/wow-data:ro
      - ./aowow-src/setup/mpqdata:/mpqdata

networks:
  wow_backend_net:
    external: true
    name: ${AC_DOCKER_NETWORK:-wow-server-playerbots_ac-network}
